# Runs on your private copy: the practice grader, then the submission check.
# Add your key as a repository secret named ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions).
# Each run spends from that key. Remove the `push` trigger if you'd rather run it by hand only.
name: grade

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grade:
    # Skip on the published template itself (its harness is the empty stub); runs on every candidate's copy.
    if: github.repository != 'gocomet-india/nova-takehome'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup
        run: make setup
      - name: Practice grader (make grade)
        run: make grade
      - name: Submission check (make validate)
        if: always()
        run: make validate
      - name: Keep the report card
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-card
          path: |
            report_card.txt
            report_card.json
